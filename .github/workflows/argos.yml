name: argos

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: argos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 1. El código: vive en el repo público (sin datos adentro).
      - name: código
        uses: actions/checkout@v4

      # 2. El estado: vive en el repo PRIVADO. Es lo que antes quedaba sólo en la VPS.
      #    Con esto, Argos en Actions arranca con la memoria completa (historial de calls,
      #    firmas vistas, lanzamientos cosechados) en vez de empezar de cero.
      - name: estado
        uses: actions/checkout@v4
        with:
          repository: COEFR/argos-datos
          token: ${{ secrets.ESTADO_TOKEN }}
          path: estado

      - name: traer el estado al lugar donde el código lo busca
        run: |
          cp -f estado/*.json . 2>/dev/null || true
          cp -f estado/*.txt . 2>/dev/null || true
          echo "archivos de estado disponibles:"
          ls -1 *.json 2>/dev/null | head -12

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: cargar claves desde los secretos
        run: |
          mkdir -p ~/.hermes
          cat > ~/.hermes/.env <<'FIN'
          HELIUS_API_KEY=${{ secrets.HELIUS_API_KEY }}
          HELIUS_API_KEY_2=${{ secrets.HELIUS_API_KEY_2 }}
          DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_HOME_CHANNEL=${{ secrets.DISCORD_HOME_CHANNEL }}
          DISCORD_SIGNALS_CHANNEL=${{ secrets.DISCORD_SIGNALS_CHANNEL }}
          DISCORD_WALLETS_CHANNEL=${{ secrets.DISCORD_WALLETS_CHANNEL }}
          DISCORD_PUMP_CHANNEL=${{ secrets.DISCORD_PUMP_CHANNEL }}
          DISCORD_ARGOS_CHANNEL=${{ secrets.DISCORD_ARGOS_CHANNEL }}
          DISCORD_ARGOS_SEGUIR=${{ secrets.DISCORD_ARGOS_SEGUIR }}
          DISCORD_ARGOS_LOTERIA=${{ secrets.DISCORD_ARGOS_LOTERIA }}
          DISCORD_ARGOS_MEJORES=${{ secrets.DISCORD_ARGOS_MEJORES }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HOME_CHANNEL=${{ secrets.TELEGRAM_HOME_CHANNEL }}
          FIN
          chmod 600 ~/.hermes/.env
          echo "claves cargadas: $(wc -l < ~/.hermes/.env)"

      - name: ciclo
        run: python argos_run.py

      # 3. Guardar el estado de vuelta en el repo privado (así la próxima corrida arranca con memoria).
      - name: guardar el estado
        run: |
          cp -f *.json estado/ 2>/dev/null || true
          cp -f *.txt estado/ 2>/dev/null || true
          cd estado
          git config user.name COEFR
          git config user.email coefr@users.noreply.github.com
          git add -A
          git commit -m "estado $(date -u '+%Y-%m-%d %H:%M UTC')" || true
          git pull --rebase --autostash origin main || true
          git push || true
