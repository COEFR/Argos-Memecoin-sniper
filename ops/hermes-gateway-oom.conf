# Protege el gateway del OOM killer (18 oct 2026).
# Sin esto el gateway corre con oom_score_adj=+200 y el kernel lo mata ANTES que
# a cualquier job de cron (que corre en 0) cuando la RAM se agota.
# -500 = el kernel prefiere matar un job de memecoins antes que el bot.
[Service]
OOMScoreAdjust=-500
